# Runs the production images locally: backend on :8000, frontend on :80.
# Uses SQLite in a named volume; put OPENAI_API_KEY etc. in backend/src/.env.
services:
  backend:
    build:
      context: ./backend/src
      dockerfile: Dockerfile
    container_name: portfolio-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite+aiosqlite:////app/data/portfolio.db
      - CORS_ORIGINS=http://localhost,http://localhost:5173
    env_file:
      - path: ./backend/src/.env
        required: false
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    # The image's own HEALTHCHECK (Python, no curl) checks /health.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: portfolio-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
