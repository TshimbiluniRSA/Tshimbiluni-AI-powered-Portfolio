name: Sync GitHub Data

# Public endpoints only read cached GitHub data. This refreshes the cache
# (profile, statistics and featured repositories) once a day.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - name: Refresh cached GitHub data
      env:
        SYNC_TOKEN: ${{ secrets.PORTFOLIO_SYNC_TOKEN }}
      run: |
        if [ -z "$SYNC_TOKEN" ]; then
          echo "::error::Add the PORTFOLIO_SYNC_TOKEN repository secret (the backend's GITHUB_SYNC_TOKEN)."
          exit 1
        fi
        curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST \
          -H "X-GitHub-Sync-Token: $SYNC_TOKEN" \
          -o /dev/null -w "HTTP %{http_code}\n" \
          https://api.tshimbiluniportfolio.tech/github/sync
