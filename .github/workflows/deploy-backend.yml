name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/src/**'
      - 'backend/scripts/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two deploys against the host at once, and never cancel one midway.
concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  DEPLOY_ROLE_ARN: arn:aws:iam::277052498943:role/GitHubPortfolioDeployRole
  INSTANCE_ID: i-0f44fcf534e52d83d
  APP_DIR: /opt/portfolio/backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/src/requirements.txt

    - name: Install dependencies
      run: pip install -r backend/src/requirements.txt

    - name: Run backend tests
      working-directory: backend/src
      run: pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy through SSM Run Command
      run: |
        # Fast-forward the host checkout to this commit, then run the
        # deploy script from that checkout. ff-only refuses to overwrite
        # local changes on the host instead of silently discarding them.
        commands=$(jq -n --arg dir "$APP_DIR" --arg sha "$GITHUB_SHA" '[
          "set -eu",
          "cd \($dir)",
          "sudo -u ssm-user git fetch --quiet origin main",
          "sudo -u ssm-user git checkout --quiet main",
          "sudo -u ssm-user git merge --ff-only --quiet \($sha)",
          "sudo -u ssm-user bash backend/scripts/deploy.sh"
        ]')

        command_id=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "Deploy ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}" \
          --parameters "$(jq -n --argjson c "$commands" '{commands: $c, executionTimeout: ["1500"]}')" \
          --query Command.CommandId --output text)
        echo "SSM command: $command_id"

        status=Pending
        while [[ "$status" =~ ^(Pending|InProgress|Delayed)$ ]]; do
          sleep 10
          status=$(aws ssm get-command-invocation \
            --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query Status --output text 2>/dev/null || echo Pending)
          echo "Status: $status"
        done

        aws ssm get-command-invocation \
          --command-id "$command_id" --instance-id "$INSTANCE_ID" \
          --query '[StandardOutputContent, StandardErrorContent]' --output text

        [[ "$status" == Success ]]

    - name: Verify public API
      run: |
        curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
          https://api.tshimbiluniportfolio.tech/health
