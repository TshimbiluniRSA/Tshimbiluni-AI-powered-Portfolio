name: Backend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/src

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          backend/src/requirements.txt
          backend/src/requirements-dev.txt

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Check formatting
      run: ruff format --check .

    - name: Run tests
      run: pytest -q --cov=. --cov-report=term-missing:skip-covered

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test

    steps:
    - uses: actions/checkout@v5

    - name: Build Docker image
      run: |
        cd backend/src
        docker build -t portfolio-backend:${{ github.sha }} .

    - name: Test Docker image
      run: |
        # The image runs as a non-root user that cannot write to /app, so the
        # throwaway SQLite database lives in /tmp.
        docker run -d --name test-backend -p 8000:8000 \
          -e DATABASE_URL=sqlite+aiosqlite:////tmp/test.db \
          portfolio-backend:${{ github.sha }}
        for attempt in {1..15}; do
          if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:8000/ready; then
            docker rm -f test-backend
            exit 0
          fi
          sleep 2
        done
        docker logs test-backend
        exit 1
