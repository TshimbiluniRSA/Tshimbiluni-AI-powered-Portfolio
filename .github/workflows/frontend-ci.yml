name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: ['24.x']

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Build
      run: |
        cd frontend
        npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: frontend-build
        path: frontend/dist
        retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test

    steps:
    - uses: actions/checkout@v5

    - name: Build Docker image
      run: |
        cd frontend
        docker build -t portfolio-frontend:${{ github.sha }} .

    - name: Test Docker image
      run: |
        cleanup() {
          docker rm -f test-frontend >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        # nginx resolves the configured `backend` upstream while starting. The
        # production Compose network provides that hostname; this standalone
        # image smoke test provides an equivalent placeholder.
        docker run -d --name test-frontend \
          --add-host backend:127.0.0.1 \
          -p 8080:80 \
          portfolio-frontend:${{ github.sha }}

        for attempt in {1..10}; do
          if curl --fail --silent --show-error http://localhost:8080/health; then
            exit 0
          fi
          sleep 1
        done

        docker logs test-frontend
        exit 1
