services:
  backend:
    container_name: portfolio-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-backend:production
    restart: unless-stopped
    env_file:
      - /opt/portfolio/config/backend.env
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
